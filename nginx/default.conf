server {
    listen 8080;

    # API — strip /smartcatering prefix before forwarding to backend
    location /smartcatering/api/v1/ {
        proxy_pass         http://backend:8001/api/v1/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # Frontend — strip /smartcatering prefix before forwarding to React app
    location /smartcatering/ {
        proxy_pass         http://frontend:3001/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # Redirect bare root to the app prefix
    location = / {
        return 301 /smartcatering/;
    }
}
